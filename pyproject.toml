[project]
name = "gtiv"
version = "1.0.0"
description = "Research toolkit for iterative voting with maximal-lottery aggregation"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "igraph>=1.0.0",
    "matplotlib>=3.10.8",
    "numba",
    "numpy>=2.0.0,<2.4",
    "scipy>=1.16.3",
]

[project.urls]
Homepage = "https://github.com/lucaslopes/gtiv"
Repository = "https://github.com/lucaslopes/gtiv"
Issues = "https://github.com/lucaslopes/gtiv/issues"

[project.scripts]
gtiv = "main:main"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gtiv", "cli*", "core*", "mechanisms*", "plots*", "strategies*"]
