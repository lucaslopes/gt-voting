[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gtiv-native"
version = "0.1.0"
description = "Optional Rust aggregation backend for gtiv"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.maturin]
module-name = "gtiv_native"
