name: Python package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve and install project dependencies from source
        run: python -m pip install .
      - name: Build wheel and source distribution
        run: |
          python -m pip install build "setuptools>=68" wheel
          python -m build --sdist --wheel
      - name: Install the built wheel
        run: python -m pip install --no-deps --force-reinstall dist/gt_voting-0.1.0-py3-none-any.whl
      - name: Smoke-test installed commands outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          gtiv --help
          gt-voting --help
      - name: Install the built source distribution
        run: python -m pip install --no-deps --no-build-isolation --force-reinstall dist/gt_voting-0.1.0.tar.gz
      - name: Smoke-test source-distribution installation outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          gtiv --help
          gt-voting --help
      - name: Prepare package artifacts and SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import shutil
          import sys
          from pathlib import Path

          output = Path("ci-artifacts")
          output.mkdir(exist_ok=True)
          artifacts = []
          for source in sorted(Path("dist").rglob("*")):
              if not source.is_file() or source.suffix not in {".whl", ".gz"}:
                  continue
              target = output / source.name
              shutil.copy2(source, target)
              data = target.read_bytes()
              artifacts.append({
                  "filename": target.name,
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          if not artifacts:
              raise SystemExit("No wheel or source archive was built")
          manifest = {
              "source_commit": os.environ.get("GITHUB_SHA"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "platform": platform.platform(),
              "python_version": sys.version,
              "artifacts": artifacts,
          }
          (output / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload hosted package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts-${{ matrix.os }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
