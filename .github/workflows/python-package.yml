---
name: Python package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve and install project dependencies from source
        run: python -m pip install .
      - name: Build wheel and source distribution
        run: |
          python -m pip install build "setuptools>=77.0.3" wheel
          python -m build --sdist --wheel
      - name: Install the built wheel
        shell: bash
        run: >-
          python -m pip install --no-deps --force-reinstall
          dist/gtiv-*.whl
      - name: Smoke-test the installed command outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          gtiv --help
      - name: Install the built source distribution
        shell: bash
        run: >-
          python -m pip install --no-deps --no-build-isolation --force-reinstall
          dist/gtiv-*.tar.gz
      - name: Smoke-test source-distribution installation outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          gtiv --help
      - name: Set up Rust when the aggregation crate is present
        if: hashFiles('native/gtiv-three/Cargo.toml') != ''
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check Rust formatting when the aggregation crate is present
        if: hashFiles('native/gtiv-three/Cargo.toml') != ''
        run: cargo fmt --check --manifest-path native/gtiv-three/Cargo.toml
      - name: Test Rust aggregation crate when present
        if: hashFiles('native/gtiv-three/Cargo.toml') != ''
        run: cargo test --locked --manifest-path native/gtiv-three/Cargo.toml
      - name: Test Rust aggregation crate in release mode when present
        if: hashFiles('native/gtiv-three/Cargo.toml') != ''
        run: cargo test --locked --release --manifest-path native/gtiv-three/Cargo.toml
      - name: Build Rust examples when the aggregation crate is present
        if: hashFiles('native/gtiv-three/Cargo.toml') != ''
        run: cargo build --locked --examples --manifest-path native/gtiv-three/Cargo.toml
      - name: Install Maturin when the native Python binding is present
        if: hashFiles('native/gtiv-native/Cargo.toml') != ''
        run: python -m pip install "maturin>=1.9,<2"
      - name: Build the native extension wheel when present
        if: hashFiles('native/gtiv-native/Cargo.toml') != ''
        run: >-
          maturin build --release --locked --interpreter python
          --manifest-path native/gtiv-native/Cargo.toml --out dist/native
      - name: Install and smoke-test the native extension wheel
        if: hashFiles('native/gtiv-native/Cargo.toml') != ''
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall dist/native/*.whl
          python native/gtiv-native/smoke_test.py
      - name: Build the native extension source distribution when present
        if: hashFiles('native/gtiv-native/Cargo.toml') != ''
        run: >-
          maturin sdist --manifest-path native/gtiv-native/Cargo.toml
          --out dist/native-sdist
      - name: Rebuild and smoke-test the native source distribution
        if: hashFiles('native/gtiv-native/Cargo.toml') != ''
        shell: bash
        run: |
          python -m pip install --no-deps --no-build-isolation --force-reinstall dist/native-sdist/gtiv_native-*.tar.gz
          python native/gtiv-native/smoke_test.py
      - name: Exercise the installed Rust aggregate CLI when available
        if: hashFiles('cli/aggregate_cli.py') != '' && hashFiles('native/gtiv-native/Cargo.toml') != ''
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          gtiv aggregate --ballot 11,7 --ballot 11,7 --ballot 7,11 --backend rust --selector minimum_norm > aggregate-result.json
          python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          result = json.loads(Path("aggregate-result.json").read_text())
          assert result["candidates"] == [11, 7]
          assert result["probabilities"] == [1.0, 0.0]
          assert result["metadata"]["backend_used"] == "rust"
          assert result["metadata"]["distribution"] == "gtiv"
          assert result["metadata"]["distribution_version"] == version("gtiv")
          assert result["metadata"]["native_api_version"] == 1
          assert len(result["metadata"]["native_binary_sha256"]) == 64
          PY
      - name: Check strategic-report backend options when integration tests exist
        if: hashFiles('tests/test_strategic_reports_backend.py') != ''
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          gtiv strategic-reports --help > strategic-reports-help.txt
          grep -q -- '--aggregation-backend' strategic-reports-help.txt
          grep -q -- '--aggregation-selector' strategic-reports-help.txt
      - name: Test Python APIs and CLIs when tests are present
        if: hashFiles('tests/**/*.py') != ''
        run: python -m unittest discover -s tests -v
      - name: Prepare package artifacts and SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import shutil
          import sys
          from pathlib import Path

          output = Path("ci-artifacts")
          output.mkdir(exist_ok=True)
          artifacts = []
          for source in sorted(Path("dist").rglob("*")):
              if not source.is_file() or source.suffix not in {".whl", ".gz"}:
                  continue
              target = output / source.name
              shutil.copy2(source, target)
              data = target.read_bytes()
              artifacts.append({
                  "filename": target.name,
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          if not artifacts:
              raise SystemExit("No wheel or source archive was built")
          manifest = {
              "source_commit": os.environ.get("GITHUB_SHA"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "platform": platform.platform(),
              "python_version": sys.version,
              "artifacts": artifacts,
          }
          (output / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload hosted package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts-${{ matrix.os }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
